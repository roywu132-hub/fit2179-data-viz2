<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovering Australia’s National Parks | FIT2179 Data Visualisation 2</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></scrip
    
    <style>
        :root {
            --forest:   #0f4c2a;
            --leaf:     #1a7a45;
            --sky:      #1d4ed8;
            --sand:     #d97706;
            --cream:    #fefdf8;
            --bark:     #4a3728;
            --mist:     #f0f4f0;
            --text:     #1c1c1c;
            --subtle:   #5a6a5a;
            --rule:     #c8d8c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.75;
        }

        .hero {
            background: var(--forest);
            color: #fff;
            padding: 80px 40px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 60% 40%, rgba(26,122,69,0.5) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #86efac;
            margin-bottom: 16px;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1.15;
            max-width: 820px;
            margin: 0 auto 20px;
        }
        .hero-sub {
            font-size: 1.1rem;
            color: #bbf7d0;
            max-width: 620px;
            margin: 0 auto;
            font-style: italic;
        }
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 48px;
            flex-wrap: wrap;
        }
        .stat-item { text-align: center; }
        .stat-num {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #86efac;
            line-height: 1;
        }
        .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            color: #bbf7d0;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--forest);
            border-bottom: 2px solid var(--leaf);
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #bbf7d0;
            text-decoration: none;
            padding: 10px 14px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-bar a:hover { background: var(--leaf); color: #fff; }

        .page { max-width: 1100px; margin: 0 auto; padding: 0 32px 80px; }

        .section { margin-top: 72px; }
        .section-num {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--leaf);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        .section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--forest);
            line-height: 1.25;
            margin-bottom: 8px;
        }
        .section-rule {
            height: 2px;
            background: linear-gradient(to right, var(--leaf), transparent);
            margin-bottom: 20px;
        }
        .section-intro {
            max-width: 820px;
            font-size: 1rem;
            color: var(--subtle);
            margin-bottom: 28px;
            line-height: 1.8;
        }
        .section-insight {
            background: var(--mist);
            border-left: 4px solid var(--leaf);
            padding: 14px 20px;
            margin: 20px 0 8px;
            border-radius: 0 6px 6px 0;
            font-size: 0.95rem;
            color: var(--forest);
        }

        .vis-wrap {
            background: #fff;
            border: 1px solid var(--rule);
            border-radius: 8px;
            padding: 28px;
            overflow-x: auto;
        }
        .vis-wrap > div { display: flex; justify-content: center; }

        .intro-section { padding: 52px 0 16px; }
        .intro-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--forest);
            margin-bottom: 14px;
        }
        .intro-section p {
            max-width: 820px;
            font-size: 1.02rem;
            color: var(--subtle);
            margin-bottom: 14px;
        }

        .callout-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 28px 0;
        }
        @media (max-width: 700px) { .callout-row { grid-template-columns: 1fr; } }
        .callout-card {
            background: var(--forest);
            color: #fff;
            border-radius: 8px;
            padding: 20px 22px;
        }
        .callout-card .c-num {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #86efac;
            display: block;
            line-height: 1;
        }
        .callout-card .c-label {
            font-size: 0.88rem;
            color: #bbf7d0;
            margin-top: 4px;
            line-height: 1.4;
        }

        .toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--forest);
            background: var(--mist);
            border: 2px solid var(--leaf);
            border-radius: 4px;
            padding: 7px 16px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .toggle-btn:hover { background: var(--leaf); color: #fff; }
        .toggle-btn.active { background: var(--forest); color: #fff; border-color: var(--forest); }
        .toggle-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .hidden { display: none; }

        footer {
            background: var(--forest);
            color: #bbf7d0;
            text-align: center;
            padding: 40px 24px;
            font-size: 0.88rem;
            line-height: 2;
        }
        footer strong { color: #86efac; }
        .data-sources {
            margin-top: 12px;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            color: rgba(187,247,208,0.7);
        }

        .vega-embed { width: 100%; }
        .vega-embed summary { display: none !important; }
    </style>
</head>

    <h2>Introduction</h2>
    <p>Australia’s national parks protect some of the country’s most distinctive landscapes, ecosystems, and cultural sites. They play a crucial role in conserving biodiversity, supporting recreation, and shaping how Australians connect with nature. As these parks vary widely in size, environment, and accessibility, understanding their distribution and characteristics is essential for appreciating their national significance.<p>

<p>This visualisation aims to help Australians explore where national parks are located, how they differ, and why they matter for conservation and public wellbeing. By presenting key patterns in a clear and accessible way, it encourages audiences to engage more deeply with Australia’s natural heritage and the importance of protecting it for future generations.</p>

    <h2>Conclusion</h2>
    <p>Australia’s national parks are among the country’s most valuable natural assets. They not only provide unique experiences for locals and international visitors but also play a critical role in biodiversity conservation and cultural preservation.</p>
    
    <p>Through this visualisation, we can see clear growth trends in visitor numbers and significant differences between states. While tourism brings important economic benefits, sustainable management will be key to protecting these precious environments for future generations.</p>
    
    <p>Key takeaway: Protecting Australia’s national parks is not only about conservation — it is also about creating meaningful connections between people and nature.</p>
